<svg width="100%" viewBox="0 0 680 990" role="img">
<title>Tête de sonde v2 : coupe A–A, zoom sur un embout laiton et vue arrière</title>
<desc>Coupe longitudinale de la tête dans un plan quasi horizontal qui passe par l'axe des deux embouts latéraux, avec le tube 16 par 14 millimètres, les embouts laiton de 3,5 millimètres collés dans des logements imprimés et les tuyaux silicone 3 par 5 ; un zoom sur un embout ; une vue arrière qui montre les trois tuyaux en triangle dans le tube.</desc>
