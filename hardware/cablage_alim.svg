<svg width="100%" viewBox="0 0 680 370" role="img" xmlns="http://www.w3.org/2000/svg"><title>Chaîne d'alimentation</title><desc>Chargeur USB-C, module TP4056 protégé, LiPo, interrupteur, boost 5,1 V, diode Schottky puis broche VIN de l'ESP32</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="58" text-anchor="middle" dominant-baseline="central">Chargeur USB-C</text><text class="ts" x="110" y="78" text-anchor="middle" dominant-baseline="central">5 V, au moins 1 A</text></g>
<g class="c-teal"><rect x="240" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="58" text-anchor="middle" dominant-baseline="central">TP4056 protégé</text><text class="ts" x="325" y="78" text-anchor="middle" dominant-baseline="central">DW01A + 8205A</text></g>
<g class="c-teal"><rect x="470" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="58" text-anchor="middle" dominant-baseline="central">LiPo plate 1S</text><text class="ts" x="555" y="78" text-anchor="middle" dominant-baseline="central">2000 mAh, 3,7 V</text></g>
<line x1="180" y1="68" x2="238" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="412" y1="68" x2="468" y2="68" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M325 96 L325 133 L100 133 L100 168" class="arr" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="335" y="124">OUT+ / OUT− protégés</text>
<g class="c-gray"><rect x="40" y="170" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="188" text-anchor="middle" dominant-baseline="central">Interrupteur</text><text class="ts" x="100" y="208" text-anchor="middle" dominant-baseline="central">sur OUT+</text></g>
<g class="c-purple"><rect x="195" y="170" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="188" text-anchor="middle" dominant-baseline="central">Boost 5,1 V</text><text class="ts" x="270" y="208" text-anchor="middle" dominant-baseline="central">à régler d'abord</text></g>
<g class="c-purple"><rect x="380" y="170" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="420" y="188" text-anchor="middle" dominant-baseline="central">D1</text><text class="ts" x="420" y="208" text-anchor="middle" dominant-baseline="central">Schottky</text></g>
<g class="c-gray"><rect x="495" y="170" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="567" y="188" text-anchor="middle" dominant-baseline="central">ESP32 DevKit</text><text class="ts" x="567" y="208" text-anchor="middle" dominant-baseline="central">broche VIN</text></g>
<line x1="160" y1="198" x2="193" y2="198" class="arr" marker-end="url(#arrow)"/>
<line x1="345" y1="198" x2="378" y2="198" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="198" x2="493" y2="198" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="70" y="290" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165" y="308" text-anchor="middle" dominant-baseline="central">Mesure batterie</text><text class="ts" x="165" y="328" text-anchor="middle" dominant-baseline="central">2 × 100 kΩ vers GPIO35</text></g>
<line x1="177" y1="290" x2="177" y2="202" class="leader"/>
<g class="c-gray"><rect x="470" y="290" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="308" text-anchor="middle" dominant-baseline="central">3V3 de la carte</text><text class="ts" x="555" y="328" text-anchor="middle" dominant-baseline="central">SDP810 ×2 et OLED</text></g>
<line x1="567" y1="226" x2="567" y2="288" class="arr" marker-end="url(#arrow)"/>
</svg>
