<svg width="100%" viewBox="0 0 680 465" role="img" xmlns="http://www.w3.org/2000/svg"><title>Câblage des signaux</title><desc>ESP32 DevKit V1 relié à deux SDP810 sur deux bus I2C, avec un écran OLED sur le bus B</desc>
<g class="c-gray"><rect x="240" y="40" width="200" height="310" rx="12" stroke-width="0.5"/></g>
<text class="th" x="340" y="62" text-anchor="middle">ESP32 DevKit V1</text><text class="ts" x="340" y="80" text-anchor="middle">ESP32 classique</text>
<text class="ts" x="248" y="130" dominant-baseline="central">GPIO21 SDA</text><text class="ts" x="432" y="130" text-anchor="end" dominant-baseline="central">GPIO25 SDA</text>
<text class="ts" x="248" y="155" dominant-baseline="central">GPIO22 SCL</text><text class="ts" x="432" y="155" text-anchor="end" dominant-baseline="central">GPIO26 SCL</text>
<text class="ts" x="248" y="180" dominant-baseline="central">3V3</text><text class="ts" x="432" y="180" text-anchor="end" dominant-baseline="central">3V3</text>
<text class="ts" x="248" y="205" dominant-baseline="central">GND</text><text class="ts" x="432" y="205" text-anchor="end" dominant-baseline="central">GND</text>
<text class="ts" x="248" y="252" dominant-baseline="central">GPIO27  bouton zéro</text>
<text class="ts" x="248" y="274" dominant-baseline="central">GPIO14, 13  boutons 2, 3</text>
<text class="ts" x="248" y="296" dominant-baseline="central">GPIO35  mesure batterie</text>
<text class="ts" x="248" y="318" dominant-baseline="central">GPIO2  LED de la carte</text>
<g class="c-teal"><rect x="40" y="70" width="150" height="155" rx="8" stroke-width="0.5"/><text class="th" x="115" y="88" text-anchor="middle" dominant-baseline="central">SDP810 n°1</text><text class="ts" x="115" y="106" text-anchor="middle" dominant-baseline="central">bus A, 0x25</text></g>
<g class="c-purple"><rect x="490" y="70" width="150" height="155" rx="8" stroke-width="0.5"/><text class="th" x="565" y="88" text-anchor="middle" dominant-baseline="central">SDP810 n°2</text><text class="ts" x="565" y="106" text-anchor="middle" dominant-baseline="central">bus B, 0x25</text></g>
<text class="ts" x="182" y="130" text-anchor="end" dominant-baseline="central">SDA</text><text class="ts" x="498" y="130" dominant-baseline="central">SDA</text>
<line x1="240" y1="130" x2="190" y2="130" stroke="#1D9E75" stroke-width="1.5"/><line x1="440" y1="130" x2="490" y2="130" stroke="#7F77DD" stroke-width="1.5"/>
<text class="ts" x="182" y="155" text-anchor="end" dominant-baseline="central">SCL</text><text class="ts" x="498" y="155" dominant-baseline="central">SCL</text>
<line x1="240" y1="155" x2="190" y2="155" stroke="#1D9E75" stroke-width="1.5"/><line x1="440" y1="155" x2="490" y2="155" stroke="#7F77DD" stroke-width="1.5"/>
<text class="ts" x="182" y="180" text-anchor="end" dominant-baseline="central">VDD</text><text class="ts" x="498" y="180" dominant-baseline="central">VDD</text>
<line x1="240" y1="180" x2="190" y2="180" stroke="#BA7517" stroke-width="1.5"/><line x1="440" y1="180" x2="490" y2="180" stroke="#BA7517" stroke-width="1.5"/>
<text class="ts" x="182" y="205" text-anchor="end" dominant-baseline="central">GND</text><text class="ts" x="498" y="205" dominant-baseline="central">GND</text>
<line x1="240" y1="205" x2="190" y2="205" stroke="#888780" stroke-width="1.5"/><line x1="440" y1="205" x2="490" y2="205" stroke="#888780" stroke-width="1.5"/>
<g class="c-teal"><rect x="40" y="245" width="150" height="50" rx="8" stroke-width="0.5"/><text class="th" x="115" y="262" text-anchor="middle" dominant-baseline="central">Pull-ups bus A</text><text class="ts" x="115" y="281" text-anchor="middle" dominant-baseline="central">2 × 4,7 kΩ → 3V3</text></g>
<g class="c-purple"><rect x="490" y="245" width="150" height="50" rx="8" stroke-width="0.5"/><text class="th" x="565" y="262" text-anchor="middle" dominant-baseline="central">Pull-ups bus B</text><text class="ts" x="565" y="281" text-anchor="middle" dominant-baseline="central">2 × 4,7 kΩ → 3V3</text></g>
<g class="c-gray"><rect x="490" y="308" width="150" height="112" rx="8" stroke-width="0.5"/><text class="th" x="565" y="326" text-anchor="middle" dominant-baseline="central">OLED SSD1306</text><text class="ts" x="565" y="344" text-anchor="middle" dominant-baseline="central">bus B, 0x3C</text></g>
<text class="ts" x="498" y="364" dominant-baseline="central">SDA</text><text class="ts" x="498" y="380" dominant-baseline="central">SCL</text><text class="ts" x="498" y="396" dominant-baseline="central">VCC</text><text class="ts" x="498" y="412" dominant-baseline="central">GND</text>
<path d="M478 130 L478 364 L490 364" stroke="#7F77DD" stroke-width="1.5" fill="none"/>
<path d="M468 155 L468 380 L490 380" stroke="#7F77DD" stroke-width="1.5" fill="none"/>
<path d="M458 180 L458 396 L490 396" stroke="#BA7517" stroke-width="1.5" fill="none"/>
<path d="M448 205 L448 412 L490 412" stroke="#888780" stroke-width="1.5" fill="none"/>
<circle cx="478" cy="130" r="2.5" fill="#7F77DD"/><circle cx="468" cy="155" r="2.5" fill="#7F77DD"/><circle cx="458" cy="180" r="2.5" fill="#BA7517"/><circle cx="448" cy="205" r="2.5" fill="#888780"/>
<line x1="40" y1="445" x2="64" y2="445" stroke="#1D9E75" stroke-width="1.5"/><text class="ts" x="72" y="445" dominant-baseline="central">bus A</text>
<line x1="170" y1="445" x2="194" y2="445" stroke="#7F77DD" stroke-width="1.5"/><text class="ts" x="202" y="445" dominant-baseline="central">bus B</text>
<line x1="300" y1="445" x2="324" y2="445" stroke="#BA7517" stroke-width="1.5"/><text class="ts" x="332" y="445" dominant-baseline="central">3V3</text>
<line x1="420" y1="445" x2="444" y2="445" stroke="#888780" stroke-width="1.5"/><text class="ts" x="452" y="445" dominant-baseline="central">GND</text>
</svg>
