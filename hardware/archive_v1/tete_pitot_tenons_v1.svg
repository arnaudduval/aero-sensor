<text class="ts" x="40" y="452" dominant-baseline="central">Tube 12 × 10 mm</text>
<line x1="90" y1="459" x2="90" y2="476" class="leader"/>

<path d="M172 440 H640 V608 H460 V468 H172 Z" fill="var(--t)" fill-opacity="0.12" stroke="var(--t)" stroke-width="0.75"/>
<rect x="172" y="468" width="288" height="3.6" fill="#EF9F27"/>
