<svg width="100%" viewBox="0 0 680 920" role="img">
<title>Coupe de la tête de sonde par l'axe des tenons latéraux</title>
<desc>Trois vues de la tête de sonde : une coupe longitudinale A-A dans un plan quasi horizontal qui passe par l'axe des deux tenons latéraux, un agrandissement de la jonction entre le canal, le tenon de 3 millimètres, le tuyau silicone et l'emboîtement du tube 12 par 10, et une vue arrière qui indique la trace du plan de coupe.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="40" y="30">Coupe A–A par l'axe des tenons latéraux</text>

<path d="M528 98 L240 98 L156 122 L156 132.8 L252 132.8 L252 207.2 L156 207.2 L156 218 L240 242 L528 242 A72 72 0 0 0 600 170 A72 72 0 0 0 528 98 Z" fill="var(--t)" fill-opacity="0.12" stroke="var(--t)" stroke-width="0.75"/>

<rect class="c-gray" x="40" y="134" width="212" height="6" stroke-width="0.5"/>
<rect class="c-gray" x="40" y="200" width="212" height="6" stroke-width="0.5"/>

<rect x="156" y="147.8" width="96" height="4.8" fill="var(--t)" fill-opacity="0.12" stroke="var(--t)" stroke-width="0.5"/>
