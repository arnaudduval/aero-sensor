<line x1="555" y1="143" x2="252" y2="156.8" stroke="#5DCAA5" stroke-width="16.8"/>
<line x1="555" y1="197" x2="252" y2="183.2" stroke="#5DCAA5" stroke-width="16.8"/>
<circle cx="555" cy="143" r="12" fill="#5DCAA5"/>
<circle cx="555" cy="197" r="12" fill="#5DCAA5"/>
<polygon points="578.4,161.7 540,161.7 510,162.4 480,164 456,166.5 445.2,170 456,173.5 480,176 510,177.6 540,178.3 578.4,178.3" fill="#5DCAA5"/>
<line x1="156" y1="156.8" x2="252" y2="156.8" stroke="#5DCAA5" stroke-width="8.4"/>
