<text class="ts" x="640" y="640" text-anchor="end" dominant-baseline="central">Canal Ø2,8 mm (imprimé)</text>
<line x1="590" y1="632" x2="590" y2="567" class="leader"/>
<text class="ts" x="230" y="662" dominant-baseline="central">Tenon Ø3,0 mm · alésage Ø1,4 mm</text>
<line x1="360" y1="654" x2="360" y2="562" class="leader"/>
<line x1="430" y1="654" x2="430" y2="546" class="leader"/>
<text class="ts" x="40" y="684" dominant-baseline="central">Tuyau 1,5 × 3 mm, étiré à Ø4,0 sur 8 mm</text>
<line x1="60" y1="676" x2="60" y2="568" class="leader"/>

<g transform="translate(0,50)">
