<rect x="132" y="122" width="168" height="50" fill="none" stroke="var(--t)" stroke-width="0.75" stroke-dasharray="4 3"/>
<text class="ts" x="40" y="108" dominant-baseline="central">Détail ci-dessous</text>

<line x1="582" y1="114" x2="590" y2="66" class="leader"/>
<text class="ts" x="640" y="58" text-anchor="end" dominant-baseline="central">Orifice à 45° Ø1,3 mm (percé)</text>
