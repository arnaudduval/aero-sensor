<path d="M88 780 a72 72 0 1 0 144 0 a72 72 0 1 0 -144 0 Z M100 780 a60 60 0 1 0 120 0 a60 60 0 1 0 -120 0 Z" fill="var(--t)" fill-opacity="0.3" fill-rule="evenodd" stroke="var(--t)" stroke-width="0.75"/>
<circle cx="160" cy="780" r="74.4" fill="none" stroke="var(--t)" stroke-width="0.75" stroke-dasharray="4 3"/>

