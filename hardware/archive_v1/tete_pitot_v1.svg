<svg width="100%" viewBox="0 0 680 560" role="img">
<title>Coupe de la tête de sonde à trois orifices</title>
<desc>Coupe longitudinale schématique de la tête de sonde dans le plan des trois orifices : nez hémisphérique de 24 millimètres avec un orifice axial et deux orifices à 45 degrés percés à 1,3 millimètre, chambres de jonction de 4 millimètres, canaux imprimés de 2,8 millimètres, emboîtement du tube 12 par 10 à l'arrière, et vue arrière montrant les trois tuyaux silicone disposés en triangle dans le tube.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="40" y="30">Coupe longitudinale (plan des trois orifices)</text>

<path d="M528 98 L240 98 L156 122 L156 132.8 L252 132.8 L252 207.2 L156 207.2 L156 218 L240 242 L528 242 A72 72 0 0 0 600 170 A72 72 0 0 0 528 98 Z" fill="var(--t)" fill-opacity="0.12" stroke="var(--t)" stroke-width="0.75"/>

<rect class="c-gray" x="40" y="134" width="212" height="6" stroke-width="0.5"/>
<rect class="c-gray" x="40" y="200" width="212" height="6" stroke-width="0.5"/>

<line x1="578.4" y1="170" x2="456" y2="170" stroke="#5DCAA5" stroke-width="16.8"/>
<line x1="555" y1="143" x2="456" y2="147.5" stroke="#5DCAA5" stroke-width="16.8"/>
<line x1="555" y1="197" x2="456" y2="192.5" stroke="#5DCAA5" stroke-width="16.8"/>
<circle cx="555" cy="143" r="12" fill="#5DCAA5"/>
<circle cx="555" cy="197" r="12" fill="#5DCAA5"/>

<line x1="600" y1="170" x2="576" y2="170" stroke="#F0997B" stroke-width="7.8"/>
<line x1="578.9" y1="119.1" x2="561" y2="137" stroke="#F0997B" stroke-width="7.8"/>
<line x1="578.9" y1="220.9" x2="561" y2="203" stroke="#F0997B" stroke-width="7.8"/>

<line x1="456" y1="118" x2="456" y2="222" class="leader"/>
<line x1="452" y1="147.5" x2="420" y2="147.5" class="leader" marker-end="url(#arrow)"/>
<line x1="452" y1="170" x2="420" y2="170" class="leader" marker-end="url(#arrow)"/>
<line x1="452" y1="192.5" x2="420" y2="192.5" class="leader" marker-end="url(#arrow)"/>
<text class="ts" x="345" y="152" text-anchor="middle" dominant-baseline="central">Suite : les 3 canaux</text>
<text class="ts" x="345" y="168" text-anchor="middle" dominant-baseline="central">convergent hors plan</text>
<text class="ts" x="345" y="184" text-anchor="middle" dominant-baseline="central">vers les 3 tenons</text>
<text class="ts" x="400" y="112" text-anchor="middle" dominant-baseline="central">Ø24 mm</text>

<line x1="582" y1="114" x2="590" y2="66" class="leader"/>
<text class="ts" x="640" y="58" text-anchor="end" dominant-baseline="central">Orifice à 45° Ø1,3 mm (percé)</text>
<line x1="547" y1="134" x2="505" y2="90" class="leader"/>
<text class="ts" x="520" y="78" text-anchor="end" dominant-baseline="central">Chambre Ø4 mm (imprimée)</text>

<line x1="599" y1="176" x2="599" y2="284" class="leader"/>
<text class="ts" x="640" y="294" text-anchor="end" dominant-baseline="central">Orifice axial Ø1,3 mm (percé)</text>
<line x1="478" y1="195" x2="405" y2="262" class="leader"/>
<text class="ts" x="400" y="270" text-anchor="end" dominant-baseline="central">Canal Ø2,8 mm (imprimé)</text>
<line x1="200" y1="222" x2="150" y2="262" class="leader"/>
<text class="ts" x="40" y="270" dominant-baseline="central">Emboîtement Ø12,4 × 16 mm</text>

<text class="ts" x="40" y="122" dominant-baseline="central">Tube 12 × 10 mm</text>
<text class="ts" x="40" y="224" dominant-baseline="central">← vers le boîtier</text>

<rect x="40" y="330" width="12" height="12" fill="#5DCAA5"/>
<text class="ts" x="58" y="336" dominant-baseline="central">Imprimé ouvert, sans perçage</text>
<rect x="250" y="330" width="12" height="12" fill="#F0997B"/>
<text class="ts" x="268" y="336" dominant-baseline="central">Percé après impression</text>

<text class="th" x="40" y="366">Vue arrière, côté tube (canal central en haut)</text>

<path d="M88 455 a72 72 0 1 0 144 0 a72 72 0 1 0 -144 0 Z M100 455 a60 60 0 1 0 120 0 a60 60 0 1 0 -120 0 Z" fill="var(--t)" fill-opacity="0.3" fill-rule="evenodd" stroke="var(--t)" stroke-width="0.75"/>
<circle cx="160" cy="455" r="74.4" fill="none" stroke="var(--t)" stroke-width="0.75" stroke-dasharray="4 3"/>
<line x1="70" y1="455" x2="250" y2="455" class="leader"/>

<circle cx="160" cy="424.5" r="24" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.75"/>
<circle cx="133.6" cy="470.2" r="24" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.75"/>
<circle cx="186.4" cy="470.2" r="24" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.75"/>
<circle cx="160" cy="424.5" r="18" fill="var(--t)" fill-opacity="0.3"/>
<circle cx="133.6" cy="470.2" r="18" fill="var(--t)" fill-opacity="0.3"/>
<circle cx="186.4" cy="470.2" r="18" fill="var(--t)" fill-opacity="0.3"/>
<circle cx="160" cy="424.5" r="8.4" fill="#5DCAA5"/>
<circle cx="133.6" cy="470.2" r="8.4" fill="#5DCAA5"/>
<circle cx="186.4" cy="470.2" r="8.4" fill="#5DCAA5"/>

<text class="th" x="290" y="400">Positions des 3 tenons (mm)</text>
<text class="ts" x="290" y="422">Central : haut +2,5 · latéral 0</text>
<text class="ts" x="290" y="440">Latéraux : bas −1,3 · latéral ±2,2</text>
<text class="ts" x="290" y="462">Tuyaux 1,5 × 3 mm étirés à Ø4,0 (tenons Ø3,0)</text>
<text class="ts" x="290" y="480">Jeu avec l'intérieur du tube : 0,5 mm</text>
<text class="ts" x="290" y="502">Pointillé : plan des trois orifices</text>
</svg>
