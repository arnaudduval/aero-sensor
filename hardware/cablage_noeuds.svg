<svg width="100%" viewBox="0 0 680 956" role="img" xmlns="http://www.w3.org/2000/svg"><title>Nœuds de câblage par broche de l'ESP32</title><desc>Pour chaque broche de l'ESP32 qui reçoit plusieurs fils : un seul fil vers un nœud, puis les branches, avec résistances, condensateurs et diode</desc>
