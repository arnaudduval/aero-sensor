<circle cx="329.3" cy="265.7" r="4.5" fill="none" stroke="var(--t)" stroke-width="0.75"/>
<circle cx="327.3" cy="281.3" r="4.5" fill="none" stroke="var(--t)" stroke-width="0.75"/>
<circle cx="323.9" cy="296.6" r="4.5" fill="none" stroke="var(--t)" stroke-width="0.75"/>
<circle cx="319.1" cy="311.6" r="4.5" fill="none" stroke="var(--t)" stroke-width="0.75"/>
<circle cx="313.1" cy="326.1" r="4.5" fill="none" stroke="var(--t)" stroke-width="0.75"/>
<circle cx="305.9" cy="340" r="4.5" fill="none" stroke="var(--t)" stroke-width="0.75"/>

<line x1="356.1" y1="131" x2="363.9" y2="126.5" stroke="var(--t)" stroke-width="0.75"/>
<line x1="373.7" y1="168.6" x2="382.1" y2="165.5" stroke="var(--t)" stroke-width="0.75"/>
