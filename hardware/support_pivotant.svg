<text class="ts" x="458" y="436" dominant-baseline="central">Pivot M5 + écrou</text>

<text class="th" x="40" y="474">Coupe selon l'axe du bras (position 0°)</text>

<line x1="150" y1="500" x2="330" y2="500" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="240" y="490" text-anchor="middle" dominant-baseline="central">60 mm</text>
<line x1="150" y1="504" x2="150" y2="540" class="leader"/>
<line x1="330" y1="504" x2="330" y2="538" class="leader"/>

<path d="M110 588 H385 V603 H166 V591 H134 V603 H110 Z" fill="var(--t)" fill-opacity="0.12" stroke="var(--t)" stroke-width="0.75"/>
<text class="ts" x="250" y="596" text-anchor="middle" dominant-baseline="central">Embase fixe</text>

