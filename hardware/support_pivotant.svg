<svg width="100%" viewBox="0 0 680 700" role="img">
<title>Support pivotant à crans pour étalonner le lacet</title>
<desc>Vue de dessus et coupe d'un support pivotant : une embase fixe en secteur de disque percée de 13 trous d'indexage tous les 5 degrés de moins 30 à plus 30 degrés sur un rayon de 60 millimètres, un bras tournant qui porte le collier du tube de sonde, un pivot M5 avec écrou à ailettes et un pion d'indexage de 3 millimètres.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="40" y="30">Vue de dessus</text>
<text class="ts" x="590" y="52" text-anchor="middle">Avant du vélo</text>
<line x1="540" y1="64" x2="640" y2="64" class="arr" marker-end="url(#arrow)"/>

<path d="M132.4 225.7 L321 88.6 A235 235 0 0 1 321 411.4 L132.4 274.3 A30 30 0 0 1 132.4 225.7 Z" fill="var(--t)" fill-opacity="0.12" stroke="var(--t)" stroke-width="0.75"/>

<circle cx="305.9" cy="160" r="4.5" fill="none" stroke="var(--t)" stroke-width="0.75"/>
