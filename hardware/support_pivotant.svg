<line x1="436" y1="563" x2="500" y2="563" class="leader"/>
<line x1="436" y1="534" x2="436" y2="563" class="leader"/>
<text class="ts" x="570" y="549" text-anchor="middle" dominant-baseline="central">Tube vers la sonde</text>

<rect class="c-gray" x="134" y="558" width="32" height="5" stroke-width="0.5"/>
<g class="c-amber">
<rect x="143" y="546" width="14" height="50" stroke-width="0.5"/>
<rect x="138" y="594" width="24" height="9" stroke-width="0.5"/>
<rect x="138" y="542" width="24" height="16" rx="3" stroke-width="0.5"/>
<rect x="124" y="540" width="14" height="8" rx="2" stroke-width="0.5"/>
<rect x="162" y="540" width="14" height="8" rx="2" stroke-width="0.5"/>
</g>

<g class="c-coral">
<rect x="326" y="548" width="8" height="50" stroke-width="0.5"/>
<rect x="319" y="540" width="22" height="8" rx="2" stroke-width="0.5"/>
</g>

<rect x="190" y="603" width="195" height="30" fill="none" stroke="var(--t)" stroke-width="0.75" stroke-dasharray="4 3"/>
<text class="ts" x="287" y="618" text-anchor="middle" dominant-baseline="central">Support vélo, quart de tour</text>

<text class="ts" x="116" y="544" text-anchor="end" dominant-baseline="central">Boulon M5 +</text>
<text class="ts" x="116" y="560" text-anchor="end" dominant-baseline="central">écrou à ailettes</text>

<line x1="352" y1="516" x2="341" y2="540" class="leader"/>
<text class="ts" x="354" y="510" dominant-baseline="central">Pion d'indexage Ø3 mm</text>

<line x1="518" y1="510" x2="496" y2="526" class="leader"/>
<text class="ts" x="522" y="504" dominant-baseline="central">Collier de tube</text>

<line x1="150" y1="604" x2="150" y2="644" class="leader"/>
<text class="ts" x="150" y="654" text-anchor="middle" dominant-baseline="central">Tête M5 noyée dans</text>
<text class="ts" x="150" y="670" text-anchor="middle" dominant-baseline="central">l'embase (empreinte hex.)</text>
